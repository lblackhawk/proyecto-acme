<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME | Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <div class="sidebar__brand">ACME Inventario</div>
        <nav class="sidebar__nav">
            <a class="sidebar__item active" href="dashboard.html">Dashboard</a>
            <a class="sidebar__item" href="productos.html">Productos</a>
            <a class="sidebar__item" href="producto-detalle.html">Detalle producto</a>
            <a class="sidebar__item" href="producto-editar.html">Editar producto</a>
        </nav>
        <div class="sidebar__footer">
            <a href="index.html">Cerrar sesion</a>
        </div>
    </aside>

    <div class="main">
        <header class="topbar">
            <span class="topbar__title">Dashboard</span>
            <a href="index.html" class="btn btn-outline">Cerrar sesion</a>
        </header>

        <div class="content">
            <div class="stats">
                <div class="card">
                    <div class="card__body">
                        <div class="stat-label">Productos</div>
                        <div class="stat-value">312</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card__body">
                        <div class="stat-label">Clientes</div>
                        <div class="stat-value">87</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card__body">
                        <div class="stat-label">Proveedores</div>
                        <div class="stat-value">14</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card__body">
                        <div class="stat-label">Categorias</div>
                        <div class="stat-value">9</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card__body card__header-title">Productos proximos a agotarse</div>
                
                <div class="low-stock-item">
                    <span>Cemento gris 50kg <span class="tag-codigo">COD-0132</span></span>
                    <span class="badge badge-danger">3 unid.</span>
                </div>
                <div class="low-stock-item">
                    <span>Varilla 3/8" x 6m <span class="tag-codigo">COD-0087</span></span>
                    <span class="badge badge-warning">8 unid.</span>
                </div>
                <div class="low-stock-item">
                    <span>Pintura blanca 1gal <span class="tag-codigo">COD-0210</span></span>
                    <span class="badge badge-warning">10 unid.</span>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
