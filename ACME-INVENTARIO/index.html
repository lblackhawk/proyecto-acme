<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME | Iniciar sesion</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    
    <div class="login-wrap">

        <div class="login-brand">
            <div class="brand-logo">ACME<span>.</span> Inventario</div>

            <div class="brand-mid">
                <h1>Un solo lugar para tu inventario, ventas y clientes.</h1>
                <p>Consulta el stock, registra ordenes de trabajo y genera reportes sin depender de hojas de cálculo dispersas.</p>
            </div>

            <div class="brand-tag">
                <span class="tag-codigo">COD-0248</span>
                <span>Control de inventario en tiempo real</span>
            </div>
        </div>

    
        <div class="login-form-wrap">
            <div class="login-card">
                <h2>Iniciar sesion</h2>
                <p class="sub">Ingresa tus credenciales para acceder al sistema.</p>

                <form action="dashboard.html" method="GET">
                    <div class="form-group">
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" placeholder="nombre.apellido" required>
                    </div>

                    <div class="form-group">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" placeholder="********" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
                </form>
            </div>
        </div>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
