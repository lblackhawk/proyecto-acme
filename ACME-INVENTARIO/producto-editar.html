<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME | Modificar producto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <div class="sidebar__brand">ACME Inventario</div>
        <nav class="sidebar__nav">
            <a class="sidebar__item" href="dashboard.html">Dashboard</a>
            <a class="sidebar__item active" href="productos.html">Productos</a>
            <a class="sidebar__item" href="producto-detalle.html">Detalle producto</a>
            <a class="sidebar__item" href="producto-editar.html">Editar producto</a>
        </nav>
        <div class="sidebar__footer">
            <a href="index.html">Cerrar sesion</a>
        </div>
    </aside>

    <div class="main">
        <header class="topbar">
            <span class="topbar__title">Modificar producto</span>
            <a href="index.html" class="btn btn-outline">Cerrar sesion</a>
        </header>

        <div class="content">

            <div class="page-header">
                <a href="productos.html">&larr; Volver a productos</a>
                <h2>Nuevo / Editar Producto <span class="tag-codigo">COD-0132</span></h2>
            </div>

        
            <div class="card">
                <div class="card__body">

                    
                    <form id="productForm">
                        
                       
                        <div class="form-row">
                            <div class="form-group">
                                <label>Codigo</label>
                                <input type="text" value="COD-0132" disabled>
                            </div>
                            <div class="form-group">
                                <label>Nombre del producto</label>
                    
                                <input type="text" id="productName" placeholder="Ej: Cemento gris 50kg">
                            </div>
                        </div>

                        
                        <div class="form-row">
                            <div class="form-group">
                                <label>Categoria</label>
                                <select>
                                    <option selected>Construccion</option>
                                    <option>Acabados</option>
                                    <option>Plomeria</option>
                                    <option>Electricos</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Ubicacion</label>
                                <select>
                                    <option selected>Bodega</option>
                                    <option>Vitrina</option>
                                </select>
                            </div>
                        </div>

                       
                        <div class="form-group">
                            <label>Descripcion</label>
                            <textarea rows="3">Cemento tipo I de uso general, presentacion en bulto de 50kg.</textarea>
                        </div>

                        
                        <div class="form-row">
                            <div class="form-group">
                                <label>Precio de entrada</label>
                                <input type="text" placeholder="Ej: 26000">
                            </div>
                            <div class="form-group">
                                <label>Precio de salida</label>
                                <!-- ID productPrice conectado a tu JS -->
                                <input type="text" id="productPrice" placeholder="Ej: 32500 (solo numeros)">
                            </div>
                        </div>

                        
                        <div class="form-row">
                            <div class="form-group">
                                <label>Unidad</label>
                                <input type="text" value="Bulto">
                            </div>
                            <div class="form-group">
                                <label>Presentacion</label>
                                <input type="text" value="50kg">
                            </div>
                        </div>

                        
                        <div class="form-row">
                            <div class="form-group">
                                <label>Cantidad disponible</label>
                                <input type="text" value="3">
                            </div>
                            <div class="form-group">
                                <label>Cantidad minima disponible</label>
                                <input type="text" value="10">
                            </div>
                        </div>

                        
                        <div class="form-group">
                            <label>Imagen del producto</label>
                            <div class="img-upload">
                                <img src="css/img/cemento-gris-50kg.jpg" alt="Cemento" class="img-preview">
                                <span>cemento-gris-50kg.jpg — haz clic para reemplazar</span>
                            </div>
                        </div>

                        
                        <div class="form-actions">
                            <div class="form-actions-left">
                                <button type="submit" class="btn btn-primary">Guardar producto</button>
                                <a href="productos.html" class="btn btn-outline">Cancelar</a>
                            </div>
                            <button type="button" class="btn btn-danger-text">Eliminar producto</button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
